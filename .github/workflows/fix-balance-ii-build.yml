name: Fix Balance II build imports
on:
  push:
    branches: [tmp-balance-ii-buildfix]
    paths: ['.github/workflows/fix-balance-ii-build.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp-balance-ii-buildfix
          fetch-depth: 0
      - name: Fix test imports
        shell: python
        run: |
          from pathlib import Path
          for name in ['balance-audit.test.ts','rebirth.test.ts','release-flow.test.ts','requirements.test.ts']:
              p = Path('src/game') / name
              s = p.read_text()
              s = s.replace("import { performStarterJob } from './perform-starter-job';\n", '')
              p.write_text(s)
          for name in ['district-heat.test.ts','manhunt.test.ts']:
              p = Path('src/game') / name
              s = p.read_text()
              marker = "import { rebirthState } from './test-fixtures/rebirth-state';\n" if name == 'district-heat.test.ts' else "import { FAST, ROOT } from './test-fixtures/skill-state';\n"
              insertion = marker + "import { readyManualJobFixture } from './test-fixtures/manual-job-ready';\n"
              if "readyManualJobFixture } from './test-fixtures/manual-job-ready'" not in s:
                  s = s.replace(marker, insertion)
              p.write_text(s)
          Path('.github/workflows/fix-balance-ii-build.yml').unlink()
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'TLSnipZ'
          git config user.email '104726894+TLSnipZ@users.noreply.github.com'
          git add -A
          git commit -m 'test: fix Balance II regression imports'
          git push origin HEAD:tmp-balance-ii-buildfix
