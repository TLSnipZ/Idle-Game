name: Apply Balance II staging patch 2
on:
  push:
    branches:
      - tmp-balance-ii-staging-2
    paths:
      - .github/workflows/apply-balance-ii-staging-2.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp-balance-ii-staging-2
          fetch-depth: 0
      - name: Reconstruct and verify regression patches
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/.balance-ii-app.patch.gz.b64 | gzip -dc > /tmp/balance-app.patch
          cat scripts/.balance-ii-game.patch.gz.b64.part1 \
              scripts/.balance-ii-game.patch.gz.b64.part2a \
              scripts/.balance-ii-game.patch.gz.b64.part2b \
              scripts/.balance-ii-game.patch.gz.b64.part3 \
              scripts/.balance-ii-game.patch.gz.b64.part4 \
            | base64 -d | gzip -dc > /tmp/balance-game.patch
          cat scripts/.balance-ii-platform.patch.gz.b64.part1 \
              scripts/.balance-ii-platform.patch.gz.b64.part2 \
            | base64 -d | gzip -dc > /tmp/balance-platform.patch
          printf '%s  %s\n' \
            dd41421716447297e6ec127fbce6a45b2b8c84bc053fda20bcf929d1cc5c74fa /tmp/balance-app.patch \
            f7630338ced8be135166478f03abf8178a5e3b5a637d83422cb8a6621801a444 /tmp/balance-game.patch \
            f81d98a9754769779a35069b91fd2089e19f3fb68d5d8bb27ca6ebcc36cd1733 /tmp/balance-platform.patch \
            > /tmp/patch-checksums
          sha256sum -c /tmp/patch-checksums
      - name: Apply regression patches
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 --forward < /tmp/balance-app.patch
          patch -p1 --forward < /tmp/balance-game.patch
          patch -p1 --forward < /tmp/balance-platform.patch
          git diff --check
      - name: Commit staged source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'test: align regression suite with Operations Balance II'
          git push origin HEAD:tmp-balance-ii-staging-2
