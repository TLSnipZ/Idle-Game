name: Apply Operations Balance II regression patch

on:
  push:
    branches: [feat/operations-balance-ii]
    paths:
      - '.github/workflows/apply-ops52-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/operations-balance-ii
          fetch-depth: 0
      - name: Apply reviewed regression patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/ops52.patch.gz.b64 | gzip -d > /tmp/ops52.patch
          echo 'f7c093297580cfb871b2d0506703052f8f9c3a701c87ca58bc1f07c60a5af5e3  /tmp/ops52.patch' | sha256sum -c -
          git apply --check /tmp/ops52.patch
          git apply /tmp/ops52.patch
          rm .github/ops52.patch.gz.b64 .github/workflows/apply-ops52-fixes.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align regressions with Operations Balance II'
          git push origin HEAD:feat/operations-balance-ii
