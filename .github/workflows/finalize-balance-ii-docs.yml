name: Finalize Operations Balance II docs
on:
  push:
    branches:
      - feat/operations-balance-ii
    paths:
      - .github/workflows/finalize-balance-ii-docs.yml
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/operations-balance-ii
          fetch-depth: 0
      - name: Update docs
        run: |
          set -euo pipefail
          python3 scripts/finalize-balance-ii-docs.py
          git diff --check
      - name: Commit docs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-balance-ii-docs.yml scripts/finalize-balance-ii-docs.py
          git add docs/ROADMAP.md docs/ARCHITECTURE.md docs/POST_ROADMAP.md docs/BALANCING.md
          git commit -m 'docs: finalize Operations Balance II contracts'
          git fetch origin feat/operations-balance-ii
          git rebase origin/feat/operations-balance-ii
          git push origin HEAD:feat/operations-balance-ii
