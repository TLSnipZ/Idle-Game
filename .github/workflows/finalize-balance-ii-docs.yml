name: Finalize Operations Balance II docs
on:
  push:
    branches: [feat/operations-balance-ii]
    paths: [.github/workflows/finalize-balance-ii-docs.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/operations-balance-ii
          fetch-depth: 0
      - name: Update authoritative Balance II documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sections = {
            'docs/ROADMAP.md': ('# Roadmap', '''## Current phase — Operations Balance II

Implemented on PR #52: portfolio-paced Operations rewards and one shared 10-second manual readiness slot. Manual base Cash is `max($25, P × 8s)` and Dispatcher base Cash is `max($25, P × 1s)`, where `P` is owned unmodified Business production at current levels; existing scoped modifiers apply afterward. Save v27 / CE1 persists pending readiness, migrates v26 ready without grants, and retains a pending delay through Rebirth/import without historic manual payout. Dedicated EN/DE/Villager browser verification is part of the acceptance gate. See [Operations Balance II](OPERATIONS_BALANCE_II.md). PR #52 remains unmerged/unpublished until explicitly approved.'''),
            'docs/ARCHITECTURE.md': ('# Architecture', '''## Current phase — Operations Balance II

Operations now owns a small serializable manual-readiness slice and a portfolio-derived reward base. `game/effective-stats.ts` derives `P` only from unmodified owned Business production, chooses the manual/Dispatcher base, then runs the existing modifier evaluator. `game/manual-job-readiness.ts` is the sole readiness contract: pending stores elapsed milliseconds; ready canonicalizes to absence; successful manual commands consume; elapsed simulation can restore at most one ready action. Dispatcher and Auto-Upgrader keep their outer-batch chronology. Save v27 / CE1 validates/migrates the optional pending slice; runtime import anchors a fresh local clock and Rebirth retains a pending delay. UI reads the authoritative readiness state and owns no independent cooldown timers. See [Operations Balance II](OPERATIONS_BALANCE_II.md).'''),
            'docs/POST_ROADMAP.md': ('# Post-roadmap priorities', '''## Current phase — Operations Balance II

The approved second Operations balance pass is implemented on PR #52. It replaces click-spam pacing with one shared 10-second manual readiness slot and makes manual/Dispatcher base Cash scale from owned unmodified Business production before existing scoped modifiers. Save v27 / CE1 preserves pending readiness across save/import/Rebirth without banking manual work. No vehicle/content/artwork expansion or unrelated layout/economy change is included. See [Operations Balance II](OPERATIONS_BALANCE_II.md). Final CI evidence belongs to PR #52; merge/deployment remain separate explicit actions.'''),
            'docs/BALANCING.md': ('# Base Game balance', '''## Current phase — Operations Balance II

Let `P` be the sum of unmodified base production/sec of all currently owned Businesses at their current levels. Standard, risky and discreet manual delivery base Cash is `max($25, P × 8s)`; Dispatcher base Cash per completed job is `max($25, P × 1s)`. Existing scoped flat and percentage modifiers apply after base selection, so production modifiers never double-dip into Operations Cash. Manual variants share one 10-second readiness slot: fresh/fully recovered is ready immediately, only success consumes it, and elapsed time restores at most one action with no offline backlog. Dispatcher remains on its existing 10-second cadence and evaluates reward once from the outer batch-start state even when Auto-Upgrader purchases occur inside the elapsed window. Save v27 / CE1 persists only pending readiness. See [Operations Balance II](OPERATIONS_BALANCE_II.md).'''),
          }
          for filename, (title, section) in sections.items():
              path = Path(filename)
              text = path.read_text()
              if '## Current phase — Operations Balance II' not in text:
                  marker = title + '\n'
                  if marker not in text:
                      raise SystemExit(f'missing title marker in {filename}')
                  text = text.replace(marker, marker + '\n' + section + '\n\n', 1)
              path.write_text(text)

          path = Path('docs/BALANCING.md')
          text = path.read_text()
          replacements = [
            ('''Fresh cash: **$0**. The manual waterfront delivery pays **$25**, **10 base XP** and
**+1 Heat after payout**. There is no cooldown. Six base deliveries fund Dockside;
ten reach Player Level 2. Heat cash penalties do not apply during those ten jobs.''',
             '''Fresh cash: **$0**. Before any Business is owned, the manual waterfront delivery
uses the **$25 floor**, pays **10 base XP** and adds **+1 Heat after payout**. Standard,
risky and discreet manual actions share one **10-second** readiness slot. The first
action is ready immediately and only a successful action consumes the slot. Six floor
jobs at 0/10/20/30/40/50 seconds fund Dockside; ten uninterrupted floor jobs reach
100 XP / Player Level 2 at the earliest around 90 seconds. Heat cash penalties do not
apply during those first ten standard jobs.'''),
            ('''Ownership always activates one delivery per
**10,000ms**. It uses current central job cash, 5 base XP per cycle, and the Heat
batch rule below. Manual jobs remain available. Completed cycles are computed
mathematically with exact partial progress; no per-cycle simulation loop exists.
At COLD, no job upgrades / either / both pay **$25 / $30 / $36** per cycle.''',
             '''Ownership always activates one delivery per
**10,000ms**. Its base Cash per cycle is `max($25, P × 1s)` from the owned unmodified
Business portfolio at the outer batch-start state; existing Dispatcher-scoped reward
modifiers apply afterward. It awards 5 base XP per cycle and keeps the Heat batch rule
below. Manual jobs remain independently available through their shared readiness slot.
Completed cycles are computed mathematically with exact partial progress; no per-cycle
simulation loop exists. While the Dispatcher base remains on the $25 floor, no job
upgrades / either / both still pay **$25 / $30 / $36** per cycle at COLD.'''),
            ('''Full job example with both normal upgrades, Fast Talker rank 1, Neon and Rico:
**($25 + $5) × 1.20 × 1.10 × 1.10 × 1.10 = $47.916** before final cent flooring.''',
             '''Manual-floor example with both normal upgrades, Fast Talker rank 1, Neon and Rico
(while the portfolio-derived manual base is still $25):
**($25 + $5) × 1.20 × 1.10 × 1.10 × 1.10 = $47.916** before final cent flooring.'''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('missing expected stale balancing paragraph: ' + old[:80])
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit finalized phase docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-balance-ii-docs.yml
          git add docs/ROADMAP.md docs/ARCHITECTURE.md docs/POST_ROADMAP.md docs/BALANCING.md
          git commit -m 'docs: finalize Operations Balance II contracts'
          git fetch origin feat/operations-balance-ii
          git rebase origin/feat/operations-balance-ii
          git push origin HEAD:feat/operations-balance-ii
