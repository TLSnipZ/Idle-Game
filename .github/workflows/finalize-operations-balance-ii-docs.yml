name: Finalize Operations Balance II architecture docs
on:
  push:
    branches: [tmp-balance-ii-staging-2]
    paths: [.github/workflows/finalize-operations-balance-ii-docs.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/operations-balance-ii
          fetch-depth: 0
      - name: Record remaining architecture handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          section = '''## Current phase — Operations Balance II\n\nOperations reward selection now lives in `src/game/effective-stats.ts`: `evaluateDeliveryRewardBase` sums catalog-backed **unmodified** production from owned Businesses, applies the manual 8-second or Dispatcher 1-second scale with the $25 floor, and only then enters the existing modifier pipeline. This prevents production modifiers from being counted twice. Dispatcher planning still prices one outer batch against its starting state, so Auto-Upgrader purchases inside elapsed simulation never reprice earlier Dispatcher jobs.\n\nManual cadence is isolated in `src/game/manual-job-readiness.ts`. A pending shared normal/risky/discreet action stores `manualJobs: { elapsedMs }`; absence is the canonical ready state. Successful commands create pending state, rejected commands preserve input, and elapsed simulation removes pending state at 10 seconds without banking extra actions. Save v27 validates that slice; v26 migration starts ready with no grants, Rebirth retains pending delay, and import preserves validated remaining delay while runtime replacement establishes a fresh local clock anchor. Presentation reads the same authoritative state. See [Operations Balance II](OPERATIONS_BALANCE_II.md).\n\n'''
          for filename in ['docs/ARCHITECTURE.md', 'docs/POST_ROADMAP.md']:
              path = Path(filename)
              text = path.read_text()
              marker = '## Current phase — Workshop purchase insight'
              if '## Current phase — Operations Balance II' not in text:
                  if marker not in text:
                      raise SystemExit(f'missing expected marker in {filename}')
                  text = text.replace(marker, section + '## Previous phase — Workshop purchase insight', 1)
                  path.write_text(text)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ARCHITECTURE.md docs/POST_ROADMAP.md
          git commit -m 'docs: finish Operations Balance II architecture handoff'
          git fetch origin feat/operations-balance-ii
          git rebase origin/feat/operations-balance-ii
          git push origin HEAD:feat/operations-balance-ii
